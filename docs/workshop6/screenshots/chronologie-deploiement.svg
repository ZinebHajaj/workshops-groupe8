<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" width="1040" height="300" role="img" aria-label="Chronologie du déploiement du 23 novembre 2026">
  <rect x="0" y="0" width="1040" height="300" fill="#f8fafc"/>
  <text x="30" y="46" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="21" font-weight="700" fill="#0f172a">Chronologie du déploiement</text>
  <text x="30" y="68" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#64748b">23 novembre 2026, heures UTC — du premier certificat au premier événement</text>

  <line x1="70" y1="160" x2="980" y2="160" stroke="#cbd5e1" stroke-width="3"/>

  <!-- 11:44 -->
  <circle cx="100" cy="160" r="7" fill="#2563eb"/>
  <text x="70" y="128" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#0f172a">11:44</text>
  <text x="70" y="112" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#475569">Certificats générés</text>

  <!-- 11:50 -->
  <circle cx="255" cy="160" r="7" fill="#2563eb"/>
  <text x="225" y="196" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#0f172a">11:50</text>
  <text x="225" y="212" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#475569">Manager → indexer établi</text>

  <!-- 12:46 -->
  <circle cx="410" cy="160" r="7" fill="#2563eb"/>
  <text x="380" y="128" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#0f172a">12:46</text>
  <text x="380" y="112" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#475569">3 services vérifiés</text>

  <!-- 13:10 -->
  <circle cx="565" cy="160" r="7" fill="#059669"/>
  <text x="530" y="196" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#0f172a">13:10:19</text>
  <text x="530" y="212" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#475569">Agent enregistré (001)</text>

  <!-- 13:15 -->
  <circle cx="720" cy="160" r="7" fill="#059669"/>
  <text x="690" y="128" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#0f172a">13:15:38</text>
  <text x="690" y="112" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#475569">Dernier keep-alive</text>

  <!-- 13:25 -->
  <circle cx="905" cy="160" r="7" fill="#7c3aed"/>
  <text x="865" y="196" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#0f172a">13:25</text>
  <text x="865" y="212" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#475569">64 événements capturés</text>

  <text x="30" y="270" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#64748b">Le trou entre 11:50 et 13:10 correspond à la bascule de version et à la réinstallation de l'agent (voir la section « incidents »).</text>
</svg>
