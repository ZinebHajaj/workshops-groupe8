<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 330" width="1040" height="330" role="img" aria-label="Du journal brut à l'incident : les trois volets du workshop">
  <rect x="0" y="0" width="1040" height="330" fill="#f8fafc"/>
  <text x="30" y="46" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="21" font-weight="700" fill="#0f172a">Du journal brut à l'incident</text>
  <text x="30" y="68" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#64748b">Un événement n'est pas une alerte. Une alerte n'est pas un incident. Tout l'exercice est là.</text>

  <!-- Événement -->
  <rect x="30" y="96" width="300" height="180" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="30" y="96" width="300" height="8" rx="4" fill="#2563eb"/>
  <text x="52" y="132" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Événement</text>
  <text x="52" y="154" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#2563eb">VOLET 1 · PLATEFORME · TERMINÉ</text>
  <text x="52" y="182" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#334155">Une ligne de journal collectée par</text>
  <text x="52" y="200" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#334155">l'agent, puis transmise au manager.</text>
  <text x="52" y="228" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#475569">64 événements sur 24 h</text>
  <text x="52" y="248" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#475569">Règles 5710 · 5503 · 2502</text>

  <!-- flèche -->
  <line x1="336" y1="186" x2="376" y2="186" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="376,179 390,186 376,193" fill="#94a3b8"/>

  <!-- Alerte -->
  <rect x="396" y="96" width="300" height="180" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="396" y="96" width="300" height="8" rx="4" fill="#d97706"/>
  <text x="418" y="132" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Alerte</text>
  <text x="418" y="154" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#b45309">VOLET 2 · DÉTECTION · EN COURS</text>
  <text x="418" y="182" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#334155">Une règle a jugé l'événement digne</text>
  <text x="418" y="200" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#334155">d'attention : niveau, identifiant, heure.</text>
  <text x="418" y="228" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#475569">Scénarios rejoués et vérifiables</text>
  <text x="418" y="248" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#475569">Contrôle automatique en CI</text>

  <!-- flèche -->
  <line x1="702" y1="186" x2="742" y2="186" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="742,179 756,186 742,193" fill="#94a3b8"/>

  <!-- Incident -->
  <rect x="762" y="96" width="248" height="180" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="762" y="96" width="248" height="8" rx="4" fill="#7c3aed"/>
  <text x="784" y="132" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Incident</text>
  <text x="784" y="154" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="700" fill="#6d28d9">VOLET 3 · RÉPONSE · EN COURS</text>
  <text x="784" y="182" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#334155">Une alerte qui exige une action</text>
  <text x="784" y="200" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#334155">et une trace écrite.</text>
  <text x="784" y="228" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#475569">MTTD · MTTA · MTTR</text>
  <text x="784" y="248" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#475569">Runbook en six phases</text>

  <text x="30" y="308" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#64748b">Chaque volet dépend du précédent : sans agent actif, pas d'alerte ; sans alerte, rien à mesurer.</text>
</svg>
