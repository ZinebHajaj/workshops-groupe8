<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" width="1040" height="300" role="img" aria-label="La chaîne DevSecOps du groupe 8, du workshop 2 au workshop 6">
  <rect x="0" y="0" width="1040" height="300" fill="#f8fafc"/>
  <text x="30" y="44" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Cinq ateliers, une seule chaîne de sécurité</text>
  <text x="30" y="66" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#64748b">Groupe 8 · chaque atelier répond à la question laissée ouverte par le précédent</text>

  <!-- W2 -->
  <rect x="26" y="96" width="180" height="128" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="26" y="96" width="180" height="7" rx="4" fill="#2563eb"/>
  <text x="44" y="128" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#2563eb">WORKSHOP 2</text>
  <text x="44" y="152" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#0f172a">SAST</text>
  <text x="44" y="174" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#475569">SonarQube + Semgrep</text>
  <text x="44" y="194" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#64748b">lire le code</text>
  <text x="44" y="214" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#64748b">branche workshop2</text>

  <!-- W3 -->
  <rect x="226" y="96" width="180" height="128" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="226" y="96" width="180" height="7" rx="4" fill="#0891b2"/>
  <text x="244" y="128" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#0e7490">WORKSHOP 3</text>
  <text x="244" y="152" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#0f172a">SCA</text>
  <text x="244" y="174" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#475569">Dependency-Check</text>
  <text x="244" y="194" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#64748b">lire les dépendances</text>
  <text x="244" y="214" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#64748b">branches workshop3-*</text>

  <!-- W4 -->
  <rect x="426" y="96" width="180" height="128" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="426" y="96" width="180" height="7" rx="4" fill="#059669"/>
  <text x="444" y="128" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#047857">WORKSHOP 4</text>
  <text x="444" y="152" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#0f172a">DAST</text>
  <text x="444" y="174" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#475569">OWASP ZAP</text>
  <text x="444" y="194" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#64748b">attaquer l'application</text>
  <text x="444" y="214" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#64748b">branche Workshop4</text>

  <!-- W5 -->
  <rect x="626" y="96" width="180" height="128" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="626" y="96" width="180" height="7" rx="4" fill="#d97706"/>
  <text x="644" y="128" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#b45309">WORKSHOP 5</text>
  <text x="644" y="152" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Image</text>
  <text x="644" y="174" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#475569">Trivy</text>
  <text x="644" y="194" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#64748b">scanner ce qu'on livre</text>
  <text x="644" y="214" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#64748b">branche workshop5-Groupe8</text>

  <!-- W6 -->
  <rect x="826" y="96" width="180" height="128" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="826" y="96" width="180" height="7" rx="4" fill="#7c3aed"/>
  <text x="844" y="128" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#6d28d9">WORKSHOP 6</text>
  <text x="844" y="152" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Runtime</text>
  <text x="844" y="174" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#475569">Wazuh</text>
  <text x="844" y="194" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#64748b">surveiller en continu</text>
  <text x="844" y="214" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#64748b">branche workshop6-Groupe8</text>

  <!-- flèches -->
  <polygon points="212,160 222,160 218,156 226,160 218,164 222,160" fill="#94a3b8"/>
  <line x1="208" y1="160" x2="222" y2="160" stroke="#94a3b8" stroke-width="2"/>
  <line x1="408" y1="160" x2="422" y2="160" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="422,155 430,160 422,165" fill="#94a3b8"/>
  <line x1="608" y1="160" x2="622" y2="160" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="622,155 630,160 622,165" fill="#94a3b8"/>
  <line x1="808" y1="160" x2="822" y2="160" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="822,155 830,160 822,165" fill="#94a3b8"/>

  <text x="30" y="262" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#64748b">Chaque atelier se termine par une porte de sortie vérifiable : une vulnérabilité corrigée, une alerte qualifiée, un pipeline qui bloque.</text>
</svg>
