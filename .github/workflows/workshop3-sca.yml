name: Workshop 3 - SCA (Dependency-Check)

on:
  push:
    branches: ['workshop3*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Préparer le lockfile (versions exactes des dépendances)
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --package-lock=true --ignore-scripts
          fi
          ls -l package-lock.json

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'workshops-groupe8'
          path: '.'
          format: 'HTML'
          out: 'reports'
          args: >
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --failOnCVSS 9

      - name: Upload du rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/
