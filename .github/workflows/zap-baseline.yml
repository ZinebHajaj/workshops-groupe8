name: DAST - ZAP Baseline

on:
  push:
    branches: [ main, Workshop4, workshop4-zap-pipeline-hasna ]
  pull_request:
    branches: [ main, Workshop4 ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lancer Juice Shop
        run: |
          docker run -d --name juice-shop -p 3000:3000 bkimminich/juice-shop
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 > /dev/null && echo "Juice Shop prêt" && exit 0
            sleep 5
          done
          echo "Juice Shop n'a pas démarré" && exit 1

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          allow_issue_writing: false
          fail_action: false

      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            report_html.html
            report_md.md
            report_json.json
