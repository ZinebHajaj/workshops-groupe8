name: Securite image - Trivy

on:
  push:
    branches: [main, Workshop5, workshop5-Groupe8, workshop5-trivy-pipeline-zineb]
  pull_request:
    branches: [main, Workshop5, workshop5-Groupe8]
  schedule:
    - cron: '0 3 * * *'   # tous les jours a 3 h UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  IMAGE_REF: bkimminich/juice-shop:latest

jobs:
  scan-image:
    name: Scan Trivy (seuil de blocage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy - rapport SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '0'

      - name: Publier le SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy-image

      - name: Trivy - rapport table
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: 'table'
          output: 'trivy-report.txt'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '0'

      - name: Trivy - SBOM CycloneDX
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: 'cyclonedx'
          output: 'sbom.cdx.json'
          exit-code: '0'

      - name: Archiver les preuves
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-report
          path: |
            trivy-results.sarif
            trivy-report.txt
            sbom.cdx.json

      - name: Trivy - seuil de blocage (CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: 'table'
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
