# =============================================================================
# Configuration SonarQube - Groupe 8 - Workshop 2
# Projet : OWASP Juice Shop (Node.js / Angular / TypeScript)
# =============================================================================

sonar.projectKey=workshops-groupe8-juice-shop
sonar.projectName=Workshop 2 - Groupe 8 - Juice Shop
sonar.projectVersion=1.0

# Le code source a analyser
sonar.sources=.
sonar.tests=test

# Encodage
sonar.sourceEncoding=UTF-8

# --- Exclusions : tout ce qui n'est pas du code applicatif ecrit par l'equipe ---
sonar.exclusions=\
  node_modules/**,\
  frontend/node_modules/**,\
  **/*.min.js,\
  **/*.min.css,\
  dist/**,\
  build/**,\
  frontend/dist/**,\
  coverage/**,\
  data/static/**,\
  ftp/**,\
  i18n/**,\
  screenshots/**,\
  docs/**,\
  .github/**,\
  tutorials/**,\
  encryptionkeys/**,\
  monitoring/**,\
  nasa-*.json

# Fichiers de test : analyses mais exclus des metriques de duplication/couverture
sonar.test.exclusions=\
  test/**,\
  **/*.spec.ts,\
  **/*.spec.js

# Puissance memoire allouee au moteur JS/TS de SonarQube
# (Juice Shop est un gros projet : sans cela le scanner peut manquer de memoire)
sonar.javascript.node.maxspace=4096

# Couverture (optionnel : a activer si vous lancez les tests unitaires en CI)
# sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Ne pas considerer les blocs generes comme du code applicatif
sonar.cpd.exclusions=**/*.spec.ts
